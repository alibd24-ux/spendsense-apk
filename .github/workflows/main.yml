name: Build SpendSense Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as ZIP
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -o -q "$z"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | grep "src/main/AndroidManifest.xml" | head -n 1)
          ANDROID_DIR=$(dirname $(dirname $(dirname $(dirname "$MANIFEST_FILE"))))
          echo "Building in: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload SpendSense APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendSense-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
