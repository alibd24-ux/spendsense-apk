name: Build SpendSense Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as ZIP
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Fix Kotlin Duplicate Class and Build Debug APK
        run: |
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | grep "src/main/AndroidManifest.xml" | head -n 1)
          ANDROID_DIR=$(dirname $(dirname $(dirname $(dirname "$MANIFEST_FILE"))))
          echo "Building Android project inside: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          find app/src/main/java -name "*.java" -exec sed -i 's/Tk\\./Tk/g' {} +
          sed -i 's/""exit"".equals(result)/result != null \&\& result.contains("exit")/g' app/src/main/java/app/spendsense/tracker/MainActivity.java
          sed -i 's/package="app.spendsense.tracker"//g' app/src/main/AndroidManifest.xml
          sed -i '/task clean/,+2d' build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")/' app/build.gradle
          gradle assembleDebug --no-daemon

      - name: Upload SpendSense APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendSense-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
