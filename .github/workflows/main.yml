name: Build SpendSense Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as ZIP
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -o -q "$z"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -d "SpendSense_Android/android" ]; then
            cd SpendSense_Android/android && gradle assembleDebug
          elif [ -d "android" ]; then
            cd android && gradle assembleDebug
          else
            echo "Finding android directory..."
            ANDROID_DIR=$(find . -maxdepth 3 -type d -name "android" | head -n 1)
            cd "$ANDROID_DIR" && gradle assembleDebug
          fi

      - name: Upload SpendSense APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendSense-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
